name: Validate repository
on:
  push:
  pull_request:
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python -m compileall -q scripts tests user_data/strategies research_strategies
      - name: Validate research and paper JSON
        run: |
          python -m json.tool user_data/config.json > /dev/null
          python -m json.tool user_data/config.paper.json > /dev/null
          python -m json.tool user_data/config.paper.okx.json > /dev/null
          python -m json.tool user_data/config.agenttrader-v1.json > /dev/null
      - name: Test AgentTrader V1 controls without exchange access
        run: python -m unittest discover -s tests -p 'test_agenttrader_v1*.py' -v
      - name: Validate both Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.paper.yml config --quiet
          docker compose -f docker-compose.okx.yml config --quiet
          docker compose -f docker-compose.agenttrader.yml config --quiet
      - name: Test with the pinned Freqtrade image and no container network
        run: |
          docker compose pull
          python3 scripts/ci_tests.py
      - name: Test AgentTrader V1 with the pinned Freqtrade runtime
        run: >-
          docker compose -f docker-compose.agenttrader.yml run --rm --no-deps
          --entrypoint python agenttrader -m unittest discover -s tests
          -p 'test_agenttrader_v1*.py' -v
