# Independente do Compose de pesquisa: usa apenas saldo fictício.
# Serviço exclusivamente fictício; a entrada rejeita configuração financeira real.
services:
  okxpaper:
    image: freqtradeorg/freqtrade:stable@sha256:9d67afb8eb5f4e1210f4fb067efcbd5e005bd4f1c27f6f3888b8b9fc7f9b5199
    restart: unless-stopped
    working_dir: /freqtrade
    entrypoint: ["python", "/freqtrade/scripts/paper_entrypoint.py", "--exchange", "okx"]
    command: []  # Entrypoint fixa trade --dry-run e rejeita argumentos/overrides.
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./scripts:/freqtrade/scripts:ro
      - ./user_data/config.paper.okx.json:/freqtrade/user_data/config.paper.okx.json:ro
      - ./user_data/strategies:/freqtrade/user_data/strategies:ro
      - ./docs:/freqtrade/docs:ro
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "/freqtrade/scripts/paper_status.py", "--exchange", "okx"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
